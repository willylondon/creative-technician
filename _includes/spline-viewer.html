<section
  id="spline-section-{{ include.canvas_id | default: 'hero-3d-scene' }}"
  style="position:fixed; inset:0; width:100%; height:100vh; z-index:0;"
>
  <div
    id="spline-fallback-{{ include.canvas_id | default: 'hero-3d-scene' }}"
    class="w-full h-screen"
    role="status"
    aria-live="polite"
    style="position:absolute; inset:0; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; z-index:0;"
  >
    Loading 3D Experience...
  </div>
  <canvas
    id="{{ include.canvas_id | default: 'hero-3d-scene' }}"
    class="w-full h-screen"
    style="position:fixed; inset:0; width:100%; height:100vh; z-index:0; pointer-events:none;"
    aria-label="3D Spline Scene"
  ></canvas>

  {% if include.overlay_html %}
    <div class="spline-overlay" style="position:absolute; inset:0; display:flex; align-items:center; z-index:1;">
      <div style="margin:0 auto; max-width:72rem; padding:0 24px;">
        {{ include.overlay_html }}
      </div>
    </div>
  {% endif %}

  <script type="module">
    const canvasId = {{ include.canvas_id | default: "hero-3d-scene" | jsonify }};
    const sceneUrl = {{ include.scene_url | jsonify }};
    const canvas = document.getElementById(canvasId);
    const fallback = document.getElementById(`spline-fallback-${canvasId}`);
    const section = document.getElementById(`spline-section-${canvasId}`);
    const interactionTargetId = {{ include.interaction_target_id | default: "" | jsonify }};
    const interactionTarget = interactionTargetId ? document.getElementById(interactionTargetId) : null;

    if (!canvas || !sceneUrl || !section) {
      console.warn('[spline-viewer] Missing canvas, section, or scene_url');
    } else {
      let hasLoaded = false;

      const loadSpline = async () => {
        if (hasLoaded) return;
        hasLoaded = true;

        const [{ Application }, gsapModule] = await Promise.all([
          import('https://unpkg.com/@splinetool/runtime'),
          import('https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm')
        ]);
        const gsap = gsapModule.gsap || gsapModule.default;

        const app = new Application(canvas);
        app.load(sceneUrl).then(() => {
          if (fallback) fallback.style.display = 'none';
        });

        const overlay = section.querySelectorAll('.spline-overlay');
        if (overlay.length && gsap) {
          gsap.from(overlay, {
            y: 24,
            opacity: 0,
            duration: 1.2,
            ease: 'elastic.out(1, 0.6)',
            stagger: 0.08
          });
        }
      };

      const observer = new IntersectionObserver(
        (entries) => {
          const entry = entries[0];
          if (entry && entry.isIntersecting) {
            observer.disconnect();
            loadSpline();
          }
        },
        { rootMargin: '200px 0px' }
      );

      observer.observe(section);

      if (interactionTarget) {
        const enablePointer = () => { canvas.style.pointerEvents = 'auto'; };
        const disablePointer = () => { canvas.style.pointerEvents = 'none'; };
        interactionTarget.addEventListener('mouseenter', enablePointer);
        interactionTarget.addEventListener('mouseleave', disablePointer);
        interactionTarget.addEventListener('focusin', enablePointer);
        interactionTarget.addEventListener('focusout', disablePointer);
        interactionTarget.addEventListener('touchstart', enablePointer, { passive: true });
        interactionTarget.addEventListener('touchend', disablePointer, { passive: true });
      }
    }
  </script>
</section>
