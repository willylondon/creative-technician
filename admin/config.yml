backend:
  name: git-gateway
  branch: main

# This enables saving as drafts
publish_mode: editorial_workflow

# Media settings
media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Categories", name: "categories", widget: "list", default: ["Blog"]}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Image Width", name: "image_width", widget: "number", default: 1200, required: false}
      - {label: "Image Height", name: "image_height", widget: "number", default: 630, required: false}
      - {label: "Featured Post", name: "featured", widget: "boolean", default: false, required: false}
      - {label: "Body", name: "body", widget: "markdown"}
